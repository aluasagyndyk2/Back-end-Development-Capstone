apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: CAPSTONE_IMAGE
          ports:
            - containerPort: 8000
          env:
            - name: SONGS_URL
              value: SONGS_ENDPOINT
            - name: PICTURES_URL
              value: PICTURES_ENDPOINT
          envFrom:
            - secretRef:
                name: capstone-config
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    run: djangoserver
  ports:
    - port: 8080
      targetPort: 8000
